name: CI & Build Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Test (${{ matrix.target_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: linux-amd64
            runner: ubuntu-latest
          - target_name: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        if: matrix.target_name == 'linux-amd64'
        run: cargo fmt --check

      - name: Clippy lint
        if: matrix.target_name == 'linux-amd64'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --verbose

      - name: Build release binary
        run: |
          cargo build --release
          strip target/release/fluxgate
          ls -lh target/release/fluxgate

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxgate-${{ matrix.target_name }}
          path: target/release/fluxgate
          retention-days: 14

  helm-and-docker:
    name: Helm Chart & Docker Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint and render Fluxgate Helm chart
        run: |
          helm lint charts/fluxgate
          helm template fluxgate charts/fluxgate --namespace ingress-prod > /tmp/fluxgate-default.yaml
          helm template fluxgate charts/fluxgate --namespace ingress-prod \
            --set traefikExtension.enabled=true \
            --set externalSecret.enabled=true \
            --set vault.enabled=true \
            --set networkPolicy.enabled=true > /tmp/fluxgate-full.yaml
          grep -q "kind: TraefikService" /tmp/fluxgate-full.yaml
          grep -q "kind: ExternalSecret" /tmp/fluxgate-full.yaml

      - name: Download native Linux release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: fluxgate-linux-*
          path: /tmp/artifacts

      - name: Stage multi-arch binaries for Docker context
        run: |
          mkdir -p dist/linux/amd64 dist/linux/arm64
          cp /tmp/artifacts/fluxgate-linux-amd64/fluxgate dist/linux/amd64/fluxgate
          cp /tmp/artifacts/fluxgate-linux-arm64/fluxgate dist/linux/arm64/fluxgate
          chmod +x dist/linux/amd64/fluxgate dist/linux/arm64/fluxgate

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ai-workspace-xstream/fluxgate
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Fluxgate container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package and push Fluxgate Helm chart to GHCR OCI
        if: github.event_name != 'pull_request'
        run: |
          helm registry login ghcr.io --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          helm package charts/fluxgate --destination /tmp/charts
          helm push /tmp/charts/fluxgate-*.tgz oci://ghcr.io/ai-workspace-xstream/charts

  release:
    name: Publish Multi-Arch GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxgate-linux-amd64
          path: dist/amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxgate-linux-arm64
          path: dist/arm64

      - name: Prepare release assets and SHA256SUMS
        run: |
          mkdir -p release-assets
          cp dist/amd64/fluxgate release-assets/fluxgate-linux-amd64
          cp dist/arm64/fluxgate release-assets/fluxgate-linux-arm64
          cp dist/amd64/fluxgate release-assets/fluxgate
          chmod +x release-assets/fluxgate*
          (cd release-assets && sha256sum fluxgate fluxgate-linux-amd64 fluxgate-linux-arm64 > SHA256SUMS && cat SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/fluxgate
            release-assets/fluxgate-linux-amd64
            release-assets/fluxgate-linux-arm64
            release-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Vault mirror & dispatch secrets
        id: vault
        continue-on-error: true
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-fluxgate
          jwtGithubAudience: vault
          ignoreNotFound: true
          secrets: |
            kv/data/prod/platform/storage/cloudflare-r2 access_key_id | R2_ACCESS_KEY_ID ;
            kv/data/prod/platform/storage/cloudflare-r2 secret_access_key | R2_SECRET_ACCESS_KEY ;
            kv/data/prod/platform/storage/cloudflare-r2 bucket | R2_BUCKET ;
            kv/data/prod/platform/storage/cloudflare-r2 endpoint | R2_ENDPOINT ;
            kv/data/prod/platform/storage/aliyun-oss access_key_id | OSS_ACCESS_KEY_ID ;
            kv/data/prod/platform/storage/aliyun-oss access_key_secret | OSS_ACCESS_KEY_SECRET ;
            kv/data/prod/platform/storage/aliyun-oss bucket | OSS_BUCKET ;
            kv/data/prod/platform/storage/aliyun-oss endpoint | OSS_ENDPOINT ;
            kv/data/prod/platform/distribution/dispatch-token token | DISPATCH_TOKEN ;

      - name: Sync dual mirrors & notify distribution hub
        env:
          R2_ACCESS_KEY_ID: ${{ steps.vault.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.vault.outputs.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ steps.vault.outputs.R2_BUCKET }}
          R2_ENDPOINT: ${{ steps.vault.outputs.R2_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ steps.vault.outputs.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ steps.vault.outputs.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ steps.vault.outputs.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ steps.vault.outputs.OSS_ENDPOINT }}
          DISPATCH_TOKEN: ${{ steps.vault.outputs.DISPATCH_TOKEN }}
        run: ./scripts/ci/sync_release_mirrors.sh fluxgate "${GITHUB_REF_NAME}" release-assets latest
