name: CI & Build Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (${{ matrix.target_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: linux-amd64
            runner: ubuntu-latest
          - target_name: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        if: matrix.target_name == 'linux-amd64'
        run: cargo fmt --check

      - name: Clippy lint
        if: matrix.target_name == 'linux-amd64'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --verbose

      - name: Build release binary
        run: |
          cargo build --release
          strip target/release/fluxgate
          ls -lh target/release/fluxgate

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxgate-${{ matrix.target_name }}
          path: target/release/fluxgate
          retention-days: 14

  release:
    name: Publish Multi-Arch GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxgate-linux-amd64
          path: dist/amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fluxgate-linux-arm64
          path: dist/arm64

      - name: Prepare release assets and SHA256SUMS
        run: |
          mkdir -p release-assets
          cp dist/amd64/fluxgate release-assets/fluxgate-linux-amd64
          cp dist/arm64/fluxgate release-assets/fluxgate-linux-arm64
          cp dist/amd64/fluxgate release-assets/fluxgate
          chmod +x release-assets/fluxgate*
          (cd release-assets && sha256sum fluxgate fluxgate-linux-amd64 fluxgate-linux-arm64 > SHA256SUMS && cat SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/fluxgate
            release-assets/fluxgate-linux-amd64
            release-assets/fluxgate-linux-arm64
            release-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
