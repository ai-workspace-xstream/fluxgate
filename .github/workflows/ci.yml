name: CI & Build Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (Linux amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake build-essential

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Clippy lint
        run: cargo clippy -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --verbose

      - name: Build release binary
        run: |
          cargo build --release
          strip target/release/fluxgate
          ls -lh target/release/fluxgate

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxgate-linux-amd64
          path: target/release/fluxgate
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/fluxgate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
