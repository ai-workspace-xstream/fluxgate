[package]
name = "fluxgate"
version = "0.2.0"
edition = "2021"
authors = ["Fluxgate Team"]
description = "Lightweight HTTP/HTTPS Reverse Proxy based on Pingora"
license = "Apache-2.0"

[dependencies]
pingora = { version = "0.9.1", default-features = false, features = ["proxy", "openssl"] }
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
http = "1.1"
bytes = "1.6"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arc-swap = "1.7"
zeroize = { version = "1.8", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
instant-acme = "0.7"
rcgen = "0.13"
x509-parser = "0.16"
pem = "3.0"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
