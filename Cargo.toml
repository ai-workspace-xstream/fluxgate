[package]
name = "fluxgate"
version = "0.1.0"
edition = "2021"
authors = ["Fluxgate Team"]
description = "Lightweight HTTP/HTTPS Reverse Proxy based on Pingora"
license = "Apache-2.0"

[dependencies]
pingora = { version = "0.9.1", default-features = false, features = ["proxy", "openssl"] }
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
http = "1.1"
bytes = "1.6"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
